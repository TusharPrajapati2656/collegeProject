<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Insurance Portal</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <div class="login-card">
        <p class="login-badge">Insurance Portal</p>
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Please enter your details to sign in to your account</p>

        <form id="login-form" class="login-form" action="home.html" method="post">
          <div class="form-group">
            <label for="mobile" class="form-label">Mobile Number</label>
            <input
              type="tel"
              id="mobile"
              name="mobile"
              class="form-input"
              placeholder="Enter 10-digit mobile number"
              pattern="[0-9]{10}"
              minlength="10"
              maxlength="10"
              inputmode="numeric"
              autocomplete="tel"
              required
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter your password"
              minlength="3"
              autocomplete="current-password"
              required
            />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--primary" id="login-btn">
              Login
            </button>
          </div>

          <p class="signup-redirect">
            Don't have an account? <a href="signup.html">Create an account</a>
          </p>
        </form>
      </div>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Insurance Portal</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/signup.css" />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="../js/validationUtils.js"></script>
    <script src="../js/signupValidation.js"></script>

  </head>
  <body>
    <main class="signup-page">
      <div class="signup-card">
        <p class="signup-badge">Insurance Portal</p>
        <h1 class="signup-title">Create Your Account</h1>
        <p class="signup-subtitle">Set up your profile to choose and manage policies</p>

        <form id="signup-form" class="signup-form" action="login.html" novalidate>
          <div class="form-group">
            <label for="full-name" class="form-label">Full Name</label>
            <input
              type="text"
              id="full-name"
              name="fullName"
              class="form-input"
              placeholder="Enter your full name"
              autocomplete="name"
            />
            <span class="error-text name-error"></span>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="e.g. alex@example.com"
              autocomplete="email"
            />
            <span class="error-text email-error"></span>
          </div>

          <div class="form-group">
            <label for="mobile" class="form-label">Mobile Number</label>
            <input
              type="tel"
              id="mobile"
              name="mobile"
              class="form-input"
              placeholder="Enter 10-digit mobile number"
              inputmode="numeric"
              maxlength="10"
              autocomplete="tel"
            />
            <span class="error-text mobile-error"></span>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Create a password"
              autocomplete="new-password"
            />
            <span class="error-text pass-error"></span>
          </div>

          <div class="form-group">
            <label for="gender" class="form-label">Gender</label>
            <select id="gender" name="gender" class="form-select">
              <option value="" disabled selected>Select an option</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
            <span class="error-text gender-error"></span>
          </div>

          <fieldset class="form-fieldset">
            <legend class="form-legend">Are you 18 or above?</legend>
            <div class="radio-group">
              <div class="radio-item">
                <input
                  type="radio"
                  id="age-yes"
                  name="ageEligibility"
                  value="yes"
                  class="form-radio"
                />
                <label for="age-yes" class="radio-label">Yes</label>
              </div>
              <div class="radio-item">
                <input
                  type="radio"
                  id="age-no"
                  name="ageEligibility"
                  value="no"
                  class="form-radio"
                />
                <label for="age-no" class="radio-label">No</label>
              </div>
            </div>
            <span class="error-text age-error"></span>
          </fieldset>

          <div class="form-group form-group--checkbox">
            <input
              type="checkbox"
              id="terms-conditions"
              name="termsAccepted"
              class="form-checkbox"
            />
            <label for="terms-conditions" class="checkbox-label">
              I accept the <a href="#">Terms &amp; Conditions</a> and <a href="#">Privacy Policy</a>
            </label>
            <span class="error-text terms-error"></span>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--primary" id="submit-btn">
              Create Account
            </button>
            <button type="reset" class="btn btn--secondary" id="reset-btn">
              Reset
            </button>
          </div>

          <p class="login-redirect">
            Already have an account? <a href="login.html">Log In</a>
          </p>
        </form>
      </div>
    </main>
  </body>
</html>
